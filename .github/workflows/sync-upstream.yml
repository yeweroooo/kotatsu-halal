name: Sync upstream and prune parsers

on:
    workflow_dispatch:
    schedule:
        - cron: '17 2 * * *'

permissions:
    contents: write

jobs:
    sync:
        if: github.repository != 'YakaTeam/kotatsu-parsers'
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2
                with:
                    fetch-depth: 0
                    ref: ${{ github.event.repository.default_branch }}

            -   name: Set up Java environment
                uses: actions/setup-java@fe779bf55ef683c9413269276a7588bb9cedf07a # v5.2.0
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Set up Android SDK
                uses: android-actions/setup-android@v3

            -   name: Install Android SDK packages
                shell: bash
                run: |
                    set +o pipefail
                    yes 2> /dev/null | sdkmanager --licenses > /dev/null
                    set -o pipefail
                    sdkmanager "platforms;android-35" "build-tools;35.0.0"

            -   name: Set up Gradle environment
                uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

            -   name: Configure git
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            -   name: Merge upstream changes
                run: |
                    if git remote get-url upstream > /dev/null 2>&1; then
                        git remote set-url upstream https://github.com/YakaTeam/kotatsu-parsers.git
                    else
                        git remote add upstream https://github.com/YakaTeam/kotatsu-parsers.git
                    fi
                    git fetch upstream master
                    git merge --no-edit upstream/master

            -   name: Prune non-selected parsers
                shell: pwsh
                run: ./scripts/prune-selected-parsers.ps1

            -   name: Refresh generated source summary and app build
                run: ./gradlew kspKotlin :app:assembleDebug --rerun-tasks

            -   name: Commit and push changes
                run: |
                    if git status --porcelain | grep .; then
                        git add .
                        git commit -m "chore: sync upstream and prune parsers"
                        git push
                    else
                        echo "No changes to push"
                    fi
