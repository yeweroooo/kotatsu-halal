name: Build APK release

on:
    push:
        tags:
            - 'nightly-*'
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            RELEASE_VERSION: ${{ github.ref_name }}
        steps:
            -   name: Checkout repository
                uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2
                with:
                    fetch-depth: 0

            -   name: Set up Java environment
                uses: actions/setup-java@fe779bf55ef683c9413269276a7588bb9cedf07a # v5.2.0
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Set up Android SDK
                uses: android-actions/setup-android@v3

            -   name: Install Android SDK packages
                shell: bash
                run: |
                    set +o pipefail
                    yes 2> /dev/null | sdkmanager --licenses > /dev/null
                    set -o pipefail
                    sdkmanager "platforms;android-35" "build-tools;35.0.0"

            -   name: Set up Gradle environment
                uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

            -   name: Build release APK
                shell: bash
                run: |
                    set -o pipefail
                    ./gradlew :app:assembleRelease -PreleaseVersion="${GITHUB_REF_NAME}" --stacktrace 2>&1 | tee gradle-build.log
                    mkdir -p release
                    apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -name '*-release.apk' | head -n 1)"
                    test -n "$apk_path"
                    cp "$apk_path" "release/kotatsu-halal-${GITHUB_REF_NAME}.apk"

            -   name: Summarize Gradle failure
                if: failure()
                shell: bash
                run: |
                    if [[ ! -f gradle-build.log ]]; then
                        echo "::error::gradle-build.log was not created"
                        exit 0
                    fi

                    matches="$(grep -E 'FAILURE:|What went wrong:|Execution failed for task|Caused by:|^[[:space:]]*e:' gradle-build.log | tail -n 20 || true)"

                    if [[ -z "${matches}" ]]; then
                        matches="$(tail -n 80 gradle-build.log || true)"
                    fi

                    while IFS= read -r line; do
                        escaped="${line//%/%25}"
                        escaped="${escaped//$'\r'/%0D}"
                        escaped="${escaped//$'\n'/%0A}"
                        echo "::error::${escaped}"
                    done <<< "${matches}"

            -   name: Upload workflow artifacts
                if: success()
                uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
                with:
                    name: kotatsu-halal-${{ github.ref_name }}
                    path: release/*.apk

            -   name: Upload Gradle log
                if: always()
                uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
                with:
                    name: gradle-log-${{ github.ref_name }}
                    path: gradle-build.log

            -   name: Publish GitHub release
                env:
                    GH_TOKEN: ${{ github.token }}
                shell: bash
                run: |
                    title="Kotatsu Halal ${GITHUB_REF_NAME}"
                    notes="Automated APK build for ${GITHUB_REF_NAME} from ${GITHUB_SHA}."
                    prerelease_flag=""

                    if [[ "${GITHUB_REF_NAME}" == nightly-* ]]; then
                        title="Nightly APK ${GITHUB_REF_NAME#nightly-}"
                        notes="Automated nightly APK build from ${GITHUB_SHA}."
                        prerelease_flag="--prerelease"
                    fi

                    if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
                        gh release upload "${GITHUB_REF_NAME}" release/*.apk --clobber
                        gh release edit "${GITHUB_REF_NAME}" --title "${title}" --notes "${notes}"
                    else
                        gh release create "${GITHUB_REF_NAME}" release/*.apk --title "${title}" --notes "${notes}" ${prerelease_flag}
                    fi
