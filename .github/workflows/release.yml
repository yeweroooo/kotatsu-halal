name: Build release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            RELEASE_VERSION: ${{ github.ref_name }}
        steps:
            -   name: Checkout repository
                uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2
                with:
                    fetch-depth: 0

            -   name: Set up Java environment
                uses: actions/setup-java@fe779bf55ef683c9413269276a7588bb9cedf07a # v5.2.0
                with:
                    java-version: '11'
                    distribution: 'temurin'

            -   name: Set up Gradle environment
                uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
                with:
                    gradle-version: '9.3.1'

            -   name: Build release artifacts
                run: ./gradlew clean assemble

            -   name: Upload workflow artifacts
                uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
                with:
                    name: kotatsu-parsers-${{ github.ref_name }}
                    path: build/libs/*.jar

            -   name: Publish GitHub release
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
                        gh release upload "${{ github.ref_name }}" build/libs/*.jar --clobber
                    else
                        gh release create "${{ github.ref_name }}" build/libs/*.jar --generate-notes --verify-tag
                    fi
